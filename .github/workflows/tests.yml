name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    # Don't run on the template repository itself, only on repos generated from it.
    if: github.repository != 'splinterlearn/student-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pytest (and your project's requirements, if any)
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run all tests in all project folders
        run: |
          set +e
          python -m pytest -ra
          status=$?
          if [ "$status" -eq 5 ]; then
            echo "No tests collected yet. That's fine before your first module."
            exit 0
          fi
          exit "$status"
